services:
    app:
        image: laravel-app
        build:
            context: .
            dockerfile: Dockerfile
        container_name: laravel-app
        ports:
            - "8000:8000"
        volumes:
            - .:/var/www
        environment:
            APP_ENV: local
            APP_URL: http://localhost:8000
            DB_HOST: mysql
            DB_PORT: 3306
            DB_DATABASE: laravel
            DB_USERNAME: sail
            DB_PASSWORD: password
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            BROADCAST_DRIVER: reverb
            CACHE_DRIVER: redis
            SESSION_DRIVER: redis
            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: 8080
        depends_on:
            - mysql
            - redis
        networks:
            harmony-net:
                aliases:
                    - app

    nginx:
        build:
            context: ./nginx
            dockerfile: Dockerfile
        image: harmony-api-nginx
        ports:
            - "80:80"
            - "443:443"

        volumes:
            - .:/var/www
            - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
            - /etc/letsencrypt:/etc/letsencrypt:ro
        depends_on:
            - app
        networks:
            - harmony-net

    mysql:
        image: mysql:8.0
        container_name: laravel-mysql
        ports:
            - "3306:3306"
        environment:
            MYSQL_ROOT_PASSWORD: password
            MYSQL_DATABASE: laravel
            MYSQL_USER: sail
            MYSQL_PASSWORD: password
        volumes:
            - mysql-data:/var/lib/mysql
        networks:
            - harmony-net
    redis:
        image: redis:alpine
        container_name: laravel-redis
        ports:
            - "6379:6379"
        volumes:
            - redis-data:/data
        networks:
            - harmony-net
    bridge:
        image: laravel-app
        container_name: laravel-bridge
        volumes:
            - .:/var/www
        command: ["sh","-lc","php artisan bridge:sub dm.* salon.* heartbeat.*"]
        networks:
            - harmony-net
    heartbeat:
        image: python:3.12
        container_name: laravel-heartbeat
        working_dir: /app
        volumes:
          - .:/app
        command: ["sh", "-lc", "pip install requests && python run-redis.py"]
        depends_on:
            - redis
            - app
            - reverb
            - bridge
        networks:
            - harmony-net

    reverb:
        image: laravel-app
        container_name: laravel-reverb
        working_dir: /var/www
        command: [ "sh", "-c", "sleep 2 && php artisan reverb:start --host=0.0.0.0 --port=8080" ]
        environment:
            REDIS_CLIENT: phpredis
            REDIS_HOST: redis
            REDIS_PORT: 6379
            BROADCAST_DRIVER: reverb
            REVERB_SERVER_HOST: 0.0.0.0
            REVERB_SERVER_PORT: 8080
        ports:
            - "8080:8080"
        depends_on:
            - app
            - redis
        volumes:
            - .:/var/www
        networks:
            - harmony-net

volumes:
    mysql-data:
    redis-data:

networks:
    harmony-net:
        driver: bridge
