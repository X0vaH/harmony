
user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events { worker_connections 1024; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    # Redirect HTTP (mapped host 8081 -> container 80) to HTTPS
    server {
        listen 80;
        server_name definitelynotharmony.dev;
        return 301 https://$host$request_uri;
    }

    server {
        listen 443 ssl;
        server_name definitelynotharmony.dev;

        ssl_certificate /etc/letsencrypt/live/definitelynotharmony.dev/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/definitelynotharmony.dev/privkey.pem;

        root /var/www/public;
        index index.html;

        location /api/ {
            proxy_pass http://laravel-app:8000/api/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Reverb websocket mounted at /reverb
        location /reverb {
            proxy_pass http://laravel-reverb:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

    	location /storage/ {
            try_files $uri =404;
    	}

        # Optional: frontend / static
        location / {
            try_files $uri $uri/ =404;
        }
    }
}

